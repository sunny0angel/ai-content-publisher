<div class="afw-tool afw-icmp" data-lang="{{ .Page.Lang }}">
<style>
.afw-icmp{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-icmp input[type=file]{font-size:.9rem;color:#334155}
.afw-icmp .wrap{position:relative;max-width:520px;margin:.8rem 0;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;touch-action:none}
.afw-icmp .wrap img{display:block;width:100%;height:320px;object-fit:contain;background:#f8fafc}
.afw-icmp .top{position:absolute;inset:0;clip-path:inset(0 0 0 var(--split,50%))}
.afw-icmp .top img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.afw-icmp .divider{position:absolute;top:0;bottom:0;left:var(--split,50%);width:2px;background:#2563eb;transform:translateX(-1px);pointer-events:none}
.afw-icmp .handle{position:absolute;top:50%;left:var(--split,50%);transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;pointer-events:none}
.afw-icmp input[type=range]{width:100%;margin:.4rem 0}
.afw-icmp label{font-size:.9rem;color:#334155;margin-right:.3rem}
</style>
<input type="file" id="afwIcmpA" accept="image/*">
<input type="file" id="afwIcmpB" accept="image/*" style="margin-left:.5rem">
<div class="wrap" id="afwIcmpWrap" style="display:none">
  <img id="afwIcmpBase" alt="">
  <div class="top"><img id="afwIcmpTop" alt=""></div>
  <div class="divider"></div>
  <div class="handle">⇄</div>
</div>
<input type="range" id="afwIcmpSplit" min="0" max="100" value="50" style="display:none">
<script>
(function(){
var root=document.querySelector('.afw-icmp');if(!root)return;
var a=document.getElementById('afwIcmpA'),b=document.getElementById('afwIcmpB');
var base=document.getElementById('afwIcmpBase'),top=document.getElementById('afwIcmpTop'),wrap=document.getElementById('afwIcmpWrap'),split=document.getElementById('afwIcmpSplit');
function load(file,img){
  var fr=new FileReader();
  fr.onload=function(e){img.src=e.target.result;check();};
  fr.readAsDataURL(file);
}
a.addEventListener('change',function(){if(a.files[0])load(a.files[0],base);});
b.addEventListener('change',function(){if(b.files[0])load(b.files[0],top);});
function check(){
  if(base.src&&top.src){
    wrap.style.display='block';split.style.display='block';
    wrap.style.setProperty('--split','50%');split.value=50;
  }
}
split.addEventListener('input',function(){
  wrap.style.setProperty('--split',split.value+'%');
});
var drag=false;
wrap.addEventListener('pointerdown',function(e){drag=true;wrap.setPointerCapture(e.pointerId);});
wrap.addEventListener('pointerup',function(){drag=false;});
wrap.addEventListener('pointermove',function(e){
  if(!drag)return;
  var r=wrap.getBoundingClientRect();
  var pct=Math.max(0,Math.min(100,Math.round((e.clientX-r.left)/r.width*100)));
  split.value=pct;
  wrap.style.setProperty('--split',pct+'%');
});
})();
</script>
</div>
