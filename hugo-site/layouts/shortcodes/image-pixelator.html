<div class="afw-tool afw-ipx" data-lang="{{ .Page.Lang }}">
<style>
.afw-ipx{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-ipx input[type=file]{font-size:.9rem;color:#334155}
.afw-ipx input[type=range]{margin:.4rem .6rem .4rem 0}
.afw-ipx label{font-size:.9rem;color:#334155;margin-right:.3rem}
.afw-ipx .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:.55rem 1rem;font-size:.9rem;font-weight:600;cursor:pointer;margin:.5rem .4rem 0 0;text-decoration:none}
.afw-ipx .btn:hover{background:#1d4ed8}
.afw-ipx img{max-width:300px;max-height:220px;border:1px solid #e2e8f0;border-radius:8px;margin:.8rem 0;display:block}
</style>
<input type="file" id="afwIpxFile" accept="image/*">
<div>
  <label class="lbl-size"></label>
  <input type="range" id="afwIpxSize" min="2" max="40" value="10">
  <b id="afwIpxVal">10</b>
</div>
<div>
  <button class="btn" id="afwIpxGo" type="button"></button>
  <a id="afwIpxDl" style="display:none" class="btn"></a>
</div>
<img id="afwIpxImg" alt="">
<script>
(function(){
var root=document.querySelector('.afw-ipx');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{size:'Pixel size',go:'Pixelate',dl:'Download',pick:'Choose an image first'},
 ja:{size:'ピクセルサイズ',go:'ピクセル化',dl:'ダウンロード',pick:'先に画像を選択してください'},
 zh:{size:'像素大小',go:'像素化',dl:'下载',pick:'请先选择图片'}
}[L]||I.en;
document.querySelector('.afw-ipx .lbl-size').textContent=I.size;
document.getElementById('afwIpxGo').textContent=I.go;
document.getElementById('afwIpxDl').textContent=I.dl;
var s=document.getElementById('afwIpxSize'),sv=document.getElementById('afwIpxVal');
s.addEventListener('input',function(){sv.textContent=s.value;});
var file=document.getElementById('afwIpxFile'),img=document.getElementById('afwIpxImg'),dl=document.getElementById('afwIpxDl');
var src=null;
file.addEventListener('change',function(){if(!file.files[0])return;var fr=new FileReader();fr.onload=function(e){src=e.target.result;img.src=src;dl.style.display='none';};fr.readAsDataURL(file.files[0]);});
document.getElementById('afwIpxGo').addEventListener('click',function(){
  if(!src){alert(I.pick);return;}
  var ps=parseInt(s.value,10);
  var W=img.naturalWidth,H=img.naturalHeight;
  var small=document.createElement('canvas');
  small.width=Math.max(1,Math.round(W/ps));small.height=Math.max(1,Math.round(H/ps));
  small.getContext('2d').drawImage(img,0,0,small.width,small.height);
  var c=document.createElement('canvas');c.width=W;c.height=H;
  var x=c.getContext('2d');x.imageSmoothingEnabled=false;
  x.drawImage(small,0,0,W,H);
  var url=c.toDataURL('image/png');
  img.src=url;dl.href=url;dl.download='pixelated.png';dl.style.display='inline-block';
});
})();
</script>
</div>
