<div class="afw-tool afw-tsim" data-lang="{{ .Page.Lang }}">
<style>
.afw-tsim{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-tsim textarea{width:100%;box-sizing:border-box;min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;border:1px solid #cbd5e1;border-radius:8px;padding:.7rem .85rem;background:#fff;color:#1e293b;resize:vertical}
.afw-tsim label{display:block;font-size:.85rem;font-weight:600;margin:.5rem 0 .35rem;color:#334155}
.afw-tsim .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:.55rem 1rem;font-size:.9rem;font-weight:600;cursor:pointer;margin:.6rem 0}
.afw-tsim .btn:hover{background:#1d4ed8}
.afw-tsim .out{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:1rem 1.1rem;margin-top:.6rem}
.afw-tsim .row{display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px dashed #e2e8f0;font-size:.92rem;color:#334155}
.afw-tsim .row:last-child{border-bottom:none}
.afw-tsim .row b{color:#0f172a;font-variant-numeric:tabular-nums}
.afw-tsim .bar{height:10px;background:#e2e8f0;border-radius:5px;overflow:hidden;margin-top:.5rem}
.afw-tsim .bar div{height:100%;background:#2563eb;border-radius:5px}
</style>
<label class="lbl-a"></label>
<textarea id="afwTsimA" placeholder="First text…"></textarea>
<label class="lbl-b"></label>
<textarea id="afwTsimB" placeholder="Second text…"></textarea>
<div>
  <button class="btn" id="afwTsimGo" type="button"></button>
</div>
<div class="out" id="afwTsimOut" hidden>
  <div class="row lbl-sim"><span></span><b id="afwTsimSim"></b></div>
  <div class="bar"><div id="afwTsimBar" style="width:0%"></div></div>
  <div class="row lbl-la"><span></span><b id="afwTsimLa"></b></div>
  <div class="row lbl-lb"><span></span><b id="afwTsimLb"></b></div>
</div>
<script>
(function(){
var root=document.querySelector('.afw-tsim');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{a:'Text A',b:'Text B',go:'Compare similarity',sim:'Similarity',la:'Text A length',lb:'Text B length',chars:'characters'},
 ja:{a:'テキストA',b:'テキストB',go:'類似度を比較',sim:'類似度',la:'テキストAの長さ',lb:'テキストBの長さ',chars:'文字'},
 zh:{a:'文本 A',b:'文本 B',go:'对比相似度',sim:'相似度',la:'文本 A 长度',lb:'文本 B 长度',chars:'字符'}
}[L]||I.en;
document.querySelector('.afw-tsim .lbl-a').textContent=I.a;
document.querySelector('.afw-tsim .lbl-b').textContent=I.b;
document.getElementById('afwTsimGo').textContent=I.go;
document.querySelector('.afw-tsim .lbl-sim span').textContent=I.sim;
document.querySelector('.afw-tsim .lbl-la span').textContent=I.la;
document.querySelector('.afw-tsim .lbl-lb span').textContent=I.lb;
var out=document.getElementById('afwTsimOut');
function lcsLen(x,y){
  var m=x.length,n=y.length;if(!m||!n)return 0;
  var prev=new Array(n+1).fill(0),cur=new Array(n+1).fill(0);
  for(var i=1;i<=m;i++){
    for(var j=1;j<=n;j++){
      cur[j]=x[i-1]===y[j-1]?prev[j-1]+1:Math.max(prev[j],cur[j-1]);
    }
    var t=prev;prev=cur;cur=t;cur.fill(0);
  }
  return prev[n];
}
document.getElementById('afwTsimGo').addEventListener('click',function(){
  var a=document.getElementById('afwTsimA').value,b=document.getElementById('afwTsimB').value;
  if(!a&&!b)return;
  var l=lcsLen(a,b);
  var mx=Math.max(a.length,b.length);
  var pct=mx?Math.round(l/mx*1000)/10:100;
  document.getElementById('afwTsimSim').textContent=pct+'%';
  document.getElementById('afwTsimBar').style.width=pct+'%';
  document.getElementById('afwTsimLa').textContent=a.length+' '+I.chars;
  document.getElementById('afwTsimLb').textContent=b.length+' '+I.chars;
  out.hidden=false;
});
})();
</script>
</div>
