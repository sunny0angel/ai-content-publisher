<div class="afw-tool afw-pnum" data-lang="{{ .Page.Lang }}">
<style>
.afw-pnum{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-pnum input[type=file]{font-size:.9rem;color:#334155}
.afw-pnum input[type=number],.afw-pnum select{font-size:14px;border:1px solid #cbd5e1;border-radius:8px;padding:.5rem .6rem;background:#fff;color:#1e293b;margin:.4rem .6rem .4rem 0}
.afw-pnum input[type=number]{width:90px}
.afw-pnum label{display:block;font-size:.85rem;font-weight:600;margin:.6rem 0 .35rem;color:#334155}
.afw-pnum .row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.4rem}
.afw-pnum .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:.55rem 1rem;font-size:.9rem;font-weight:600;cursor:pointer;margin:.6rem .4rem 0 0}
.afw-pnum .btn:hover{background:#1d4ed8}
.afw-pnum .msg{margin:.6rem 0;padding:.55rem .9rem;border-radius:8px;font-size:.88rem}
.afw-pnum .msg.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.afw-pnum .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
</style>
<input type="file" id="afwPnFile" accept=".pdf">
<div class="row">
  <div><label class="lbl-pos"></label><select id="afwPnPos">
    <option value="bc">bottom center</option>
    <option value="br">bottom right</option>
    <option value="bl">bottom left</option>
    <option value="tc">top center</option>
  </select></div>
  <div><label class="lbl-start"></label><input type="number" id="afwPnStart" value="1" min="1"></div>
  <div><label class="lbl-size"></label><input type="number" id="afwPnSize" value="10" min="6" max="36"></div>
  <div><label class="lbl-total"></label><select id="afwPnTotal">
    <option value="0">off</option>
    <option value="1">on</option>
  </select></div>
</div>
<div>
  <button class="btn" id="afwPnGo" type="button"></button>
</div>
<div class="msg" id="afwPnMsg" hidden></div>
<script src="/js/pdf-tools.js" defer></script>
<script>
(function(){
var root=document.querySelector('.afw-pnum');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{pos:'Position',start:'Start number',size:'Font size',total:'Show total',go:'Add page numbers',pick:'Select a PDF first',done:'Page numbers added — download started',load:'PDF engine failed to load — please refresh'},
 ja:{pos:'位置',start:'開始番号',size:'文字サイズ',total:'総ページ数',go:'ページ番号を追加',pick:'先にPDFを選択してください',done:'ページ番号を追加しました——ダウンロード開始',load:'PDFエンジンの読み込みに失敗——再読み込みしてください'},
 zh:{pos:'位置',start:'起始编号',size:'字号',total:'显示总页数',go:'添加页码',pick:'请先选择 PDF',done:'页码已添加——开始下载',load:'PDF 引擎加载失败——请刷新页面'}
}[L]||I.en;
document.querySelector('.afw-pnum .lbl-pos').textContent=I.pos;
document.querySelector('.afw-pnum .lbl-start').textContent=I.start;
document.querySelector('.afw-pnum .lbl-size').textContent=I.size;
document.querySelector('.afw-pnum .lbl-total').textContent=I.total;
document.getElementById('afwPnGo').textContent=I.go;
var file=document.getElementById('afwPnFile'),msg=document.getElementById('afwPnMsg');
function show(t,ok){msg.hidden=false;msg.className='msg '+(ok?'ok':'err');msg.textContent=t;}
function boot(fn){if(!window.AFW){show(I.load||'PDF engine failed to load — please refresh',false);return;}window.AFW.loadPdfLib().then(fn).catch(function(){show(I.load||'PDF engine failed to load — please refresh',false);});}
function dl(doc,name){doc.save().then(function(b){var blob=new Blob([b],{type:'application/pdf'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();});}
document.getElementById('afwPnGo').addEventListener('click',function(){
  if(!file.files[0]){show(I.pick,false);return;}
  var pos=document.getElementById('afwPnPos').value;
  var start=Math.max(1,parseInt(document.getElementById('afwPnStart').value,10)||1);
  var size=Math.max(6,Math.min(36,parseInt(document.getElementById('afwPnSize').value,10)||10));
  var totalMode=document.getElementById('afwPnTotal').value==='1';
  boot(async function(){
    try{
      var doc=await window.PDFLib.PDFDocument.load(await file.files[0].arrayBuffer());
      var font=await doc.embedFont(window.PDFLib.StandardFonts.Helvetica);
      var pages=doc.getPages(),count=pages.length;
      pages.forEach(function(p,i){
        var w=p.getWidth(),h=p.getHeight();
        var text=totalMode?(start+i)+' / '+(start+count-1):''+(start+i);
        var tw=font.widthOfTextAtSize(text,size);
        var x=pos==='br'?w-tw-36:(pos==='bl'?36:(w-tw)/2);
        var y=pos.charAt(0)==='t'?h-size-24:24;
        p.drawText(text,{x:x,y:y,size:size,font:font,color:window.PDFLib.rgb(0.35,0.35,0.35)});
      });
      dl(doc,'numbered.pdf');
      show(I.done,true);
    }catch(e){show(e.message,false);}
  });
});
})();
</script>

<p class="afw-pdfnote">{{ i18n "pdf_original_note" }}</p>
<p class="afw-pdfnote">{{ i18n "pdf_local_note" }}</p>
</div>
