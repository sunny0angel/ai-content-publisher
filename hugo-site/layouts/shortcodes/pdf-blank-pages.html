<div class="afw-tool afw-pblank" data-lang="{{ .Page.Lang }}">
<style>
.afw-pblank{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-pblank input[type=number]{font-size:14px;border:1px solid #cbd5e1;border-radius:8px;padding:.5rem .6rem;background:#fff;color:#1e293b;margin:.4rem .6rem .4rem 0;width:70px}
.afw-pblank select{font-size:14px;border:1px solid #cbd5e1;border-radius:8px;padding:.5rem .6rem;background:#fff;color:#1e293b;margin:.4rem .6rem .4rem 0}
.afw-pblank label{display:block;font-size:.85rem;font-weight:600;margin:.6rem 0 .35rem;color:#334155}
.afw-pblank .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:.55rem 1rem;font-size:.9rem;font-weight:600;cursor:pointer;margin:.6rem .4rem 0 0}
.afw-pblank .btn:hover{background:#1d4ed8}
.afw-pblank .msg{margin:.6rem 0;padding:.55rem .9rem;border-radius:8px;font-size:.88rem}
.afw-pblank .msg.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.afw-pblank .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
</style>
<label class="lbl-count"></label>
<input type="number" id="afwPblankN" value="1" min="1" max="100">
<label class="lbl-size"></label>
<select id="afwPblankS">
  <option value="a4">A4</option>
  <option value="letter">Letter</option>
</select>
<div>
  <button class="btn" id="afwPblankGo" type="button"></button>
</div>
<div class="msg" id="afwPblankMsg" hidden></div>
<script src="/js/pdf-tools.js" defer></script>
<script>
(function(){
var root=document.querySelector('.afw-pblank');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{count:'Number of blank pages',size:'Page size',go:'Generate blank PDF',done:'Created — download started'},
 ja:{count:'空白ページ数',size:'ページサイズ',go:'空白PDFを生成',done:'作成完了——ダウンロード開始'},
 zh:{count:'空白页数量',size:'页面尺寸',go:'生成空白 PDF',done:'已生成——开始下载'}
}[L]||I.en;
document.querySelector('.afw-pblank .lbl-count').textContent=I.count;
document.querySelector('.afw-pblank .lbl-size').textContent=I.size;
document.getElementById('afwPblankGo').textContent=I.go;
var n=document.getElementById('afwPblankN'),sel=document.getElementById('afwPblankS'),msg=document.getElementById('afwPblankMsg');
var SIZES={a4:[595,842],letter:[612,792]};
function show(t,ok){msg.hidden=false;msg.className='msg '+(ok?'ok':'err');msg.textContent=t;}
function boot(fn){if(!window.AFW){show(I.load||'PDF engine failed to load — please refresh',false);return;}window.AFW.loadPdfLib().then(fn).catch(function(){show(I.load||'PDF engine failed to load — please refresh',false);});}
function dl(doc,name){doc.save().then(function(b){var blob=new Blob([b],{type:'application/pdf'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();});}
document.getElementById('afwPblankGo').addEventListener('click',function(){
  var count=Math.max(1,Math.min(100,parseInt(n.value,10)||1));
  var s=SIZES[sel.value];
  boot(async function(){
    try{
      var out=await window.PDFLib.PDFDocument.create();
      for(var i=0;i<count;i++)out.addPage([s[0],s[1]]);
      dl(out,'blank.pdf');
      show(I.done,true);
    }catch(e){show(e.message,false);}
  });
});
})();
</script>

<p class="afw-pdfnote">{{ i18n "pdf_local_note" }}</p>
</div>
