<div class="afw-tool afw-psplit" data-lang="{{ .Page.Lang }}">
<style>
.afw-psplit{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-psplit input[type=file]{font-size:.9rem;color:#334155}
.afw-psplit input[type=number],.afw-psplit input[type=text]{font-size:14px;border:1px solid #cbd5e1;border-radius:8px;padding:.5rem .6rem;background:#fff;color:#1e293b;margin:.4rem .6rem .4rem 0}
.afw-psplit label{display:block;font-size:.85rem;font-weight:600;margin:.6rem 0 .35rem;color:#334155}
.afw-psplit .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:.55rem 1rem;font-size:.9rem;font-weight:600;cursor:pointer;margin:.6rem .4rem 0 0}
.afw-psplit .btn:hover{background:#1d4ed8}
.afw-psplit .msg{margin:.6rem 0;padding:.55rem .9rem;border-radius:8px;font-size:.88rem}
.afw-psplit .msg.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.afw-psplit .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
</style>
<input type="file" id="afwPsFile" accept=".pdf">
<label class="lbl-mode"></label>
<input type="text" id="afwPsRange" placeholder="1-3, 5, 7-9">
<div>
  <button class="btn" id="afwPsGo" type="button"></button>
</div>
<div class="msg" id="afwPsMsg" hidden></div>
<script src="/js/pdf-tools.js" defer></script>
<script>
(function(){
var root=document.querySelector('.afw-psplit');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{mode:'Pages to extract (e.g. "1-3, 5, 7-9"; 1-based)',go:'Extract pages to a new PDF',pick:'Select a PDF and page range',done:'Extracted — download started'},
 ja:{mode:'抽出するページ（例: "1-3, 5, 7-9"、1始まり）',go:'ページを抽出して新PDFに',pick:'PDFとページ範囲を指定してください',done:'抽出完了——ダウンロード開始'},
 zh:{mode:'要提取的页（如 "1-3, 5, 7-9"，从 1 起）',go:'提取页面为新 PDF',pick:'请选择 PDF 并填写页码范围',done:'已提取——开始下载'}
}[L]||I.en;
document.querySelector('.afw-psplit .lbl-mode').textContent=I.mode;
document.getElementById('afwPsGo').textContent=I.go;
var file=document.getElementById('afwPsFile'),range=document.getElementById('afwPsRange'),msg=document.getElementById('afwPsMsg');
function show(t,ok){msg.hidden=false;msg.className='msg '+(ok?'ok':'err');msg.textContent=t;}
function boot(fn){if(!window.AFW){show(I.load||'PDF engine failed to load — please refresh',false);return;}window.AFW.loadPdfLib().then(fn).catch(function(){show(I.load||'PDF engine failed to load — please refresh',false);});}
function dl(doc,name){doc.save().then(function(b){var blob=new Blob([b],{type:'application/pdf'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();});}
function parseRange(s){
  var idx=[];
  s.split(',').forEach(function(part){
    part=part.trim();
    var m=part.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){for(var i=+m[1];i<=+m[2];i++)idx.push(i-1);}
    else if(/^\d+$/.test(part)){idx.push(+part-1);}
  });
  return idx;
}
document.getElementById('afwPsGo').addEventListener('click',function(){
  if(!file.files[0]||!range.value.trim()){show(I.pick,false);return;}
  var idx=parseRange(range.value);
  if(!idx.length){show(I.pick,false);return;}
  boot(async function(){
    try{
      var src=await window.PDFLib.PDFDocument.load(await file.files[0].arrayBuffer());
      var total=src.getPageCount();
      idx=idx.filter(function(i){return i>=0&&i<total;});
      var out=await window.PDFLib.PDFDocument.create();
      var pages=await out.copyPages(src,idx);
      pages.forEach(function(p){out.addPage(p);});
      dl(out,'extracted.pdf');
      show(I.done,true);
    }catch(e){show(e.message,false);}
  });
});
})();
</script>

<p class="afw-pdfnote">{{ i18n "pdf_original_note" }}</p>
<p class="afw-pdfnote">{{ i18n "pdf_local_note" }}</p>
</div>
