<div class="afw-tool afw-pw" data-lang="{{ .Page.Lang }}">
<style>
.afw-pw{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-pw .opts{display:flex;flex-wrap:wrap;gap:.9rem;align-items:center;margin:.6rem 0}
.afw-pw label{font-size:.9rem;color:#334155}
.afw-pw input[type=range]{width:180px}
.afw-pw .out{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;letter-spacing:1px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:.9rem 1rem;word-break:break-all;color:#0f172a;min-height:24px;margin:.6rem 0}
.afw-pw .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:.55rem 1rem;font-size:.9rem;font-weight:600;cursor:pointer;margin-right:.5rem}
.afw-pw .btn:hover{background:#1d4ed8}
.afw-pw .btn.sec{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
.afw-pw .btn.sec:hover{background:#e2e8f0}
.afw-pw .strength{font-size:.82rem;color:#64748b;margin-top:.3rem}
</style>
<div class="opts">
  <label class="lbl-len"></label>
  <input type="range" id="afwPwLen" min="8" max="64" value="20">
  <b id="afwPwLenVal">20</b>
</div>
<div class="opts">
  <label><input type="checkbox" id="afwPwUpper" checked> A-Z</label>
  <label><input type="checkbox" id="afwPwLower" checked> a-z</label>
  <label><input type="checkbox" id="afwPwNum" checked> 0-9</label>
  <label><input type="checkbox" id="afwPwSym" checked> !@#$</label>
</div>
<div>
  <button class="btn" id="afwPwGen" type="button"></button>
  <button class="btn sec" id="afwPwCopy" type="button"></button>
</div>
<div class="out" id="afwPwOut"></div>
<div class="strength" id="afwPwStrength"></div>
<script>
(function(){
var root=document.querySelector('.afw-pw');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{len:'Length',gen:'Generate password',copy:'Copy',strength:'Estimated strength:',weak:'weak',ok:'fair',strong:'strong',err:'Select at least one character set'},
 ja:{len:'長さ',gen:'パスワードを生成',copy:'コピー',strength:'推定強度:',weak:'弱い',ok:'普通',strong:'強い',err:'少なくとも1つの文字種を選択してください'},
 zh:{len:'长度',gen:'生成密码',copy:'复制',strength:'预估强度:',weak:'弱',ok:'中',strong:'强',err:'请至少选择一种字符集'}
}[L]||I.en;
document.querySelector('.afw-pw .lbl-len').textContent=I.len;
document.getElementById('afwPwGen').textContent=I.gen;
document.getElementById('afwPwCopy').textContent=I.copy;
var len=document.getElementById('afwPwLen'),lenv=document.getElementById('afwPwLenVal'),out=document.getElementById('afwPwOut'),str=document.getElementById('afwPwStrength');
len.addEventListener('input',function(){lenv.textContent=len.value;});
var UP='ABCDEFGHJKLMNPQRSTUVWXYZ',LOW='abcdefghijkmnopqrstuvwxyz',NUM='23456789',SYM='!@#$%^&*()-_=+[]{}';
function gen(){
  var sets=[];if(document.getElementById('afwPwUpper').checked)sets.push(UP);if(document.getElementById('afwPwLower').checked)sets.push(LOW);if(document.getElementById('afwPwNum').checked)sets.push(NUM);if(document.getElementById('afwPwSym').checked)sets.push(SYM);
  if(!sets.length){out.textContent=I.err;str.textContent='';return;}
  var n=parseInt(len.value,10),all=sets.join(''),pw='';
  sets.forEach(function(s){pw+=s[rand(s.length)];});
  while(pw.length<n)pw+=all[rand(all.length)];
  pw=pw.split('').sort(function(){return rand(3)-1;}).join('');
  out.textContent=pw;
  var e=Math.floor(n*Math.log2(all.length));
  str.textContent=I.strength+' '+(e<50?I.weak:(e<80?I.ok:I.strong))+' (~'+e+' bits)';
}
function rand(mx){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%mx;}
document.getElementById('afwPwGen').addEventListener('click',gen);
document.getElementById('afwPwCopy').addEventListener('click',function(){if(!out.textContent)return;navigator.clipboard&&navigator.clipboard.writeText(out.textContent);});
gen();
})();
</script>
</div>
