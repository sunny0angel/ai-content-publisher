<div class="afw-tool afw-pflat" data-lang="{{ .Page.Lang }}">
<style>
.afw-pflat{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-pflat input[type=file]{font-size:.9rem;color:#334155}
.afw-pflat .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:.55rem 1rem;font-size:.9rem;font-weight:600;cursor:pointer;margin:.6rem .4rem 0 0}
.afw-pflat .btn:hover{background:#1d4ed8}
.afw-pflat .msg{margin:.6rem 0;padding:.55rem .9rem;border-radius:8px;font-size:.88rem}
.afw-pflat .msg.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.afw-pflat .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.afw-pflat .msg.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
</style>
<input type="file" id="afwPflatFile" accept=".pdf">
<div>
  <button class="btn" id="afwPflatGo" type="button"></button>
</div>
<div class="msg" id="afwPflatMsg" hidden></div>
<script src="/js/pdf-tools.js" defer></script>
<script>
(function(){
var root=document.querySelector('.afw-pflat');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{go:'Flatten form and download',pick:'Select a PDF first',done:'Flattened — download started',none:'No form fields found — the PDF is already flat (or contains only annotations).',fields:'form fields flattened',load:'PDF engine failed to load — please refresh'},
 ja:{go:'フォームを平坦化してダウンロード',pick:'先にPDFを選択してください',done:'平坦化完了——ダウンロード開始',none:'フォームフィールドが見つかりません——PDFはすでに平坦（または注釈のみ）です。',fields:'個のフォームフィールドを平坦化',load:'PDFエンジンの読み込みに失敗——再読み込みしてください'},
 zh:{go:'扁平化表单并下载',pick:'请先选择 PDF',done:'已扁平化——开始下载',none:'未发现表单字段——该 PDF 已扁平（或仅含注释）。',fields:'个表单字段已扁平化',load:'PDF 引擎加载失败——请刷新页面'}
}[L]||I.en;
document.getElementById('afwPflatGo').textContent=I.go;
var file=document.getElementById('afwPflatFile'),msg=document.getElementById('afwPflatMsg');
function show(t,cls){msg.hidden=false;msg.className='msg '+cls;msg.textContent=t;}
function boot(fn){if(!window.AFW){show(I.load||'PDF engine failed to load — please refresh',false);return;}window.AFW.loadPdfLib().then(fn).catch(function(){show(I.load||'PDF engine failed to load — please refresh',false);});}
function dl(doc,name){doc.save().then(function(b){var blob=new Blob([b],{type:'application/pdf'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();});}
document.getElementById('afwPflatGo').addEventListener('click',function(){
  if(!file.files[0]){show(I.pick,'err');return;}
  boot(async function(){
    try{
      var doc=await window.PDFLib.PDFDocument.load(await file.files[0].arrayBuffer());
      var form=doc.getForm();
      var fields=form.getFields();
      if(!fields.length){show(I.none,'info');return;}
      form.flatten();
      dl(doc,'flattened.pdf');
      show(fields.length+' '+I.fields+' — '+I.done,'ok');
    }catch(e){show(e.message,'err');}
  });
});
})();
</script>

<p class="afw-pdfnote">{{ i18n "pdf_original_note" }}</p>
<p class="afw-pdfnote">{{ i18n "pdf_local_note" }}</p>
</div>
