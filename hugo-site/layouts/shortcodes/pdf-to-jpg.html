<div class="afw-tool afw-p2jpg" data-lang="{{ .Page.Lang }}">
<style>
.afw-p2jpg{max-width:900px;margin:1.5rem 0;font-family:inherit}
.afw-p2jpg input[type=file]{font-size:.9rem;color:#334155}
.afw-p2jpg input[type=number],.afw-p2jpg select{font-size:14px;border:1px solid #cbd5e1;border-radius:8px;padding:.5rem .6rem;background:#fff;color:#1e293b;margin:.4rem .6rem .4rem 0}
.afw-p2jpg input[type=number]{width:90px}
.afw-p2jpg label{display:block;font-size:.85rem;font-weight:600;margin:.6rem 0 .35rem;color:#334155}
.afw-p2jpg .row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.4rem}
.afw-p2jpg .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:.55rem 1rem;font-size:.9rem;font-weight:600;cursor:pointer;margin:.6rem .4rem 0 0}
.afw-p2jpg .btn:hover{background:#1d4ed8}
.afw-p2jpg .btn.sec{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
.afw-p2jpg .btn.sec:hover{background:#e2e8f0}
.afw-p2jpg .msg{margin:.6rem 0;padding:.55rem .9rem;border-radius:8px;font-size:.88rem}
.afw-p2jpg .msg.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.afw-p2jpg .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.afw-p2jpg .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem;margin-top:.8rem}
.afw-p2jpg .card{border:1px solid #e2e8f0;border-radius:8px;padding:.4rem;background:#f8fafc;text-align:center}
.afw-p2jpg .card img{max-width:100%;display:block;margin:0 auto .3rem;border:1px solid #e2e8f0;background:#fff}
.afw-p2jpg .card .n{font-size:.75rem;color:#64748b;margin-bottom:.3rem}
.afw-p2jpg .card button{background:#2563eb;color:#fff;border:none;border-radius:6px;padding:.3rem .6rem;font-size:.78rem;cursor:pointer}
.afw-p2jpg .hint{font-size:.78rem;color:#64748b;margin-top:.3rem}
</style>
<input type="file" id="afwP2jFile" accept=".pdf">
<div class="row">
  <div><label class="lbl-dpi"></label><select id="afwP2jDpi">
    <option value="96">96 DPI</option>
    <option value="150" selected>150 DPI</option>
    <option value="300">300 DPI</option>
  </select></div>
  <div><label class="lbl-quality"></label><input type="number" id="afwP2jQ" value="90" min="40" max="100"></div>
  <div><label class="lbl-pages"></label><input type="text" id="afwP2jPages" value="1-3" placeholder="1-3, 5"></div>
</div>
<div class="hint" id="afwP2jHint"></div>
<div>
  <button class="btn" id="afwP2jGo" type="button"></button>
  <button class="btn sec" id="afwP2jAll" type="button" hidden></button>
</div>
<div class="msg" id="afwP2jMsg" hidden></div>
<div class="grid" id="afwP2jGrid"></div>
<script src="/js/vendor/pdf.min.js" defer></script>
<script>
(function(){
var root=document.querySelector('.afw-p2jpg');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{dpi:'Resolution',quality:'JPEG quality (%)',pages:'Pages (blank = all, e.g. "1-3, 5")',hint:'Pages render locally with PDF.js and download as JPEG. Text-heavy pages are better kept as PDF; this is for sharing previews and scans.',go:'Convert to JPG',all:'Download all',pick:'Select a PDF first',done:'pages converted',load:'PDF engine failed to load — please refresh',dl:'Download',busy:'Rendering…',bad:'Could not read this PDF. If it is password-protected, remove the password first.'},
 ja:{dpi:'解像度',quality:'JPEG画質（%）',pages:'ページ（空欄=全て、例 "1-3, 5"）',hint:'PDF.jsでローカルに描画し、JPEGとしてダウンロードします。文字中心のページはPDFのままが最適。共有用プレビューやスキャン向けです。',go:'JPGに変換',all:'全てダウンロード',pick:'先にPDFを選択してください',done:'ページを変換しました',load:'PDFエンジンの読み込みに失敗——再読み込みしてください',dl:'ダウンロード',busy:'描画中…',bad:'このPDFを読み込めません。パスワード保護の場合は先に解除してください。'},
 zh:{dpi:'分辨率',quality:'JPEG 质量（%）',pages:'页码（留空=全部，如 "1-3, 5"）',hint:'用 PDF.js 在本地渲染并下载为 JPEG。文字为主的页面保持 PDF 更合适；本工具适合分享预览图和扫描件。',go:'转换为 JPG',all:'全部下载',pick:'请先选择 PDF',done:'页已转换',load:'PDF 引擎加载失败——请刷新页面',dl:'下载',busy:'渲染中…',bad:'无法读取该 PDF。若有密码保护，请先移除密码。'}
}[L]||I.en;
document.querySelector('.afw-p2jpg .lbl-dpi').textContent=I.dpi;
document.querySelector('.afw-p2jpg .lbl-quality').textContent=I.quality;
document.querySelector('.afw-p2jpg .lbl-pages').textContent=I.pages;
document.getElementById('afwP2jHint').textContent=I.hint;
document.getElementById('afwP2jGo').textContent=I.go;
document.getElementById('afwP2jAll').textContent=I.all;
var file=document.getElementById('afwP2jFile'),msg=document.getElementById('afwP2jMsg'),grid=document.getElementById('afwP2jGrid'),allBtn=document.getElementById('afwP2jAll');
var blobs=[];
function show(t,ok){msg.hidden=false;msg.className='msg '+(ok?'ok':'err');msg.textContent=t;}
function boot(fn){if(window.pdfjsLib){fn();return;}var n=0,t=setInterval(function(){if(window.pdfjsLib){clearInterval(t);fn();}else if(++n>200){clearInterval(t);show(I.load,false);}},50);}
function parsePages(s,total){
  s=(s||'').trim();
  if(!s){var a=[];for(var i=0;i<total;i++)a.push(i);return a;}
  var out=[];
  s.split(',').forEach(function(part){
    part=part.trim();
    var m=part.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){for(var i=+m[1];i<=+m[2];i++)if(i>=1&&i<=total)out.push(i-1);}
    else if(/^\d+$/.test(part)&&+part>=1&&+part<=total)out.push(+part-1);
  });
  return out;
}
function download(blob,name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
}
document.getElementById('afwP2jGo').addEventListener('click',function(){
  if(!file.files[0]){show(I.pick,false);return;}
  var dpi=parseInt(document.getElementById('afwP2jDpi').value,10)||150;
  var q=Math.max(40,Math.min(100,parseInt(document.getElementById('afwP2jQ').value,10)||90))/100;
  var range=document.getElementById('afwP2jPages').value;
  grid.innerHTML='';blobs=[];allBtn.hidden=true;
  show(I.busy,true);
  boot(async function(){
    try{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='/js/vendor/pdf.worker.min.js';
      var buf=await file.files[0].arrayBuffer();
      var pdf=await window.pdfjsLib.getDocument({data:buf,cMapUrl:'/js/vendor/cmaps/',cMapPacked:true,standardFontDataUrl:'/js/vendor/standard_fonts/'}).promise;
      var list=parsePages(range,pdf.numPages);
      if(!list.length)list=Array.from({length:pdf.numPages},function(_,i){return i;});
      for(var k=0;k<list.length;k++){
        var page=await pdf.getPage(list[k]+1);
        var vp=page.getViewport({scale:dpi/72});
        var canvas=document.createElement('canvas');
        canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);
        await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
        var blob=await new Promise(function(res){canvas.toBlob(res,'image/jpeg',q);});
        var name='page-'+(list[k]+1)+'.jpg';
        blobs.push({blob:blob,name:name});
        var card=document.createElement('div');card.className='card';
        var img=document.createElement('img');img.src=URL.createObjectURL(blob);img.loading='lazy';
        var n=document.createElement('div');n.className='n';n.textContent='Page '+(list[k]+1);
        var btn=document.createElement('button');btn.type='button';btn.textContent=I.dl;
        (function(bl,nm){btn.addEventListener('click',function(){download(bl,nm);});})(blob,name);
        card.appendChild(img);card.appendChild(n);card.appendChild(btn);
        grid.appendChild(card);
      }
      allBtn.hidden=false;
      show(list.length+' '+I.done,true);
    }catch(e){show(I.bad+' ('+e.message+')',false);}
  });
});
allBtn.addEventListener('click',function(){
  blobs.forEach(function(b,i){setTimeout(function(){download(b.blob,b.name);},i*500);});
});
})();
</script>
</div>
