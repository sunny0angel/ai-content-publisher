<div class="afw-tool afw-prot" data-lang="{{ .Page.Lang }}">
<style>
.afw-prot{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-prot input[type=file]{font-size:.9rem;color:#334155}
.afw-prot select{font-size:14px;border:1px solid #cbd5e1;border-radius:8px;padding:.5rem .6rem;background:#fff;color:#1e293b;margin:.4rem .6rem .4rem 0}
.afw-prot label{display:block;font-size:.85rem;font-weight:600;margin:.6rem 0 .35rem;color:#334155}
.afw-prot .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:.55rem 1rem;font-size:.9rem;font-weight:600;cursor:pointer;margin:.6rem .4rem 0 0}
.afw-prot .btn:hover{background:#1d4ed8}
.afw-prot .msg{margin:.6rem 0;padding:.55rem .9rem;border-radius:8px;font-size:.88rem}
.afw-prot .msg.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.afw-prot .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
</style>
<input type="file" id="afwProtFile" accept=".pdf">
<label class="lbl-mode"></label>
<select id="afwProtDeg">
  <option value="90">90°</option>
  <option value="180">180°</option>
  <option value="270">270°</option>
</select>
<div>
  <button class="btn" id="afwProtGo" type="button"></button>
</div>
<div class="msg" id="afwProtMsg" hidden></div>
<script src="/js/vendor/pdf-lib.min.js" defer></script>
<script>
(function(){
var root=document.querySelector('.afw-prot');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{mode:'Rotate all pages by',go:'Rotate and download',pick:'Select a PDF first',done:'Rotated — download started'},
 ja:{mode:'全ページを回転',go:'回転してダウンロード',pick:'先にPDFを選択してください',done:'回転完了——ダウンロード開始'},
 zh:{mode:'旋转全部页面',go:'旋转并下载',pick:'请先选择 PDF',done:'已旋转——开始下载'}
}[L]||I.en;
document.querySelector('.afw-prot .lbl-mode').textContent=I.mode;
document.getElementById('afwProtGo').textContent=I.go;
var file=document.getElementById('afwProtFile'),deg=document.getElementById('afwProtDeg'),msg=document.getElementById('afwProtMsg');
function show(t,ok){msg.hidden=false;msg.className='msg '+(ok?'ok':'err');msg.textContent=t;}
function boot(fn){if(window.PDFLib){fn();return;}var n=0,t=setInterval(function(){if(window.PDFLib){clearInterval(t);fn();}else if(++n>160){clearInterval(t);show(I.load||'PDF engine failed to load — please refresh',false);}},50);}
function dl(doc,name){doc.save().then(function(b){var blob=new Blob([b],{type:'application/pdf'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();});}
document.getElementById('afwProtGo').addEventListener('click',function(){
  if(!file.files[0]){show(I.pick,false);return;}
  var d=parseInt(deg.value,10);
  boot(async function(){
    try{
      var doc=await window.PDFLib.PDFDocument.load(await file.files[0].arrayBuffer());
      doc.getPages().forEach(function(p){p.setRotation(window.PDFLib.degrees(d));});
      dl(doc,'rotated.pdf');
      show(I.done,true);
    }catch(e){show(e.message,false);}
  });
});
})();
</script>
</div>
