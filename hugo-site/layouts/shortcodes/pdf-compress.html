<div class="afw-tool afw-pcmp" data-lang="{{ .Page.Lang }}">
<style>
.afw-pcmp{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-pcmp input[type=file]{font-size:.9rem;color:#334155}
.afw-pcmp input[type=number],.afw-pcmp select{font-size:14px;border:1px solid #cbd5e1;border-radius:8px;padding:.5rem .6rem;background:#fff;color:#1e293b;margin:.4rem .6rem .4rem 0}
.afw-pcmp input[type=number]{width:90px}
.afw-pcmp label{display:block;font-size:.85rem;font-weight:600;margin:.6rem 0 .35rem;color:#334155}
.afw-pcmp .row{display:flex;flex-wrap:wrap;gap:.4rem}
.afw-pcmp .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:.55rem 1rem;font-size:.9rem;font-weight:600;cursor:pointer;margin:.6rem .4rem 0 0}
.afw-pcmp .btn:hover{background:#1d4ed8}
.afw-pcmp .msg{margin:.6rem 0;padding:.55rem .9rem;border-radius:8px;font-size:.88rem}
.afw-pcmp .msg.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.afw-pcmp .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.afw-pcmp .hint{font-size:.78rem;color:#64748b;margin-top:.3rem}
</style>
<input type="file" id="afwPcmpFile" accept=".pdf">
<div class="row">
  <div><label class="lbl-dpi"></label><select id="afwPcmpDpi">
    <option value="72">72 DPI (smallest)</option>
    <option value="110" selected>110 DPI (balanced)</option>
    <option value="150">150 DPI (sharper)</option>
  </select></div>
  <div><label class="lbl-q"></label><input type="number" id="afwPcmpQ" value="65" min="30" max="95"></div>
</div>
<div class="hint" id="afwPcmpHint"></div>
<div>
  <button class="btn" id="afwPcmpGo" type="button"></button>
</div>
<div class="msg" id="afwPcmpMsg" hidden></div>
<script src="/js/pdf-tools.js" defer></script>

<script>
(function(){
var root=document.querySelector('.afw-pcmp');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{dpi:'Render resolution',q:'JPEG quality (%)',hint:'Pages are re-rendered as images, so text becomes non-selectable — ideal for scans and image-heavy decks. Check the result before replacing the original.',go:'Compress and download',pick:'Select a PDF first',busy:'Compressing…',done:'done',smaller:'smaller',bigger:'This PDF is already efficient — the rebuilt file is not smaller, but it was downloaded anyway.',load:'PDF engine failed to load — please refresh',bad:'Could not read this PDF. If it is password-protected, remove the password first.',from:'before',to:'after'},
 ja:{dpi:'描画解像度',q:'JPEG画質（%）',hint:'ページを画像として再描画するため、文字は選択不可になります——スキャンや画像中心の資料に最適。置き換え前に結果を確認してください。',go:'圧縮してダウンロード',pick:'先にPDFを選択してください',busy:'圧縮中…',done:'完了',smaller:'削減',bigger:'このPDFはすでに効率的です——再構築しても小さくなりませんが、ダウンロードは実行しました。',load:'PDFエンジンの読み込みに失敗——再読み込みしてください',bad:'このPDFを読み込めません。パスワード保護の場合は先に解除してください。',from:'前',to:'後'},
 zh:{dpi:'渲染分辨率',q:'JPEG 质量（%）',hint:'页面会被重新渲染为图片，文字将无法选中——适合扫描件和图片型文档。替换原文件前请先检查结果。',go:'压缩并下载',pick:'请先选择 PDF',busy:'压缩中…',done:'完成',smaller:'更小',bigger:'该 PDF 已经很精简——重建后并未变小，但仍已下载。',load:'PDF 引擎加载失败——请刷新页面',bad:'无法读取该 PDF。若有密码保护，请先移除密码。',from:'压缩前',to:'压缩后'}
}[L]||I.en;
document.querySelector('.afw-pcmp .lbl-dpi').textContent=I.dpi;
document.querySelector('.afw-pcmp .lbl-q').textContent=I.q;
document.getElementById('afwPcmpHint').textContent=I.hint;
document.getElementById('afwPcmpGo').textContent=I.go;
var file=document.getElementById('afwPcmpFile'),msg=document.getElementById('afwPcmpMsg');
function show(t,ok){msg.hidden=false;msg.className='msg '+(ok?'ok':'err');msg.textContent=t;}
function boot(fn){if(!window.AFW){show(I.load,false);return;}Promise.all([window.AFW.loadPdfLib(),window.AFW.loadPdfJs()]).then(fn).catch(function(){show(I.load,false);});}
function fmt(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB';}
document.getElementById('afwPcmpGo').addEventListener('click',function(){
  if(!file.files[0]){show(I.pick,false);return;}
  var dpi=parseInt(document.getElementById('afwPcmpDpi').value,10)||110;
  var q=Math.max(30,Math.min(95,parseInt(document.getElementById('afwPcmpQ').value,10)||65))/100;
  show(I.busy,true);
  boot(async function(){
    try{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='/js/vendor/pdf.worker.min.js';
      var srcBuf=await file.files[0].arrayBuffer();
      var srcPdf=await window.pdfjsLib.getDocument({data:srcBuf.slice(0),cMapUrl:'/js/vendor/cmaps/',cMapPacked:true,standardFontDataUrl:'/js/vendor/standard_fonts/'}).promise;
      var out=await window.PDFLib.PDFDocument.create();
      for(var i=1;i<=srcPdf.numPages;i++){
        var page=await srcPdf.getPage(i);
        var vp=page.getViewport({scale:dpi/72});
        var canvas=document.createElement('canvas');
        canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);
        await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
        var blob=await new Promise(function(res){canvas.toBlob(res,'image/jpeg',q);});
        var img=await out.embedJpg(await blob.arrayBuffer());
        var base=page.getViewport({scale:1});
        var p=out.addPage([base.width,base.height]);
        p.drawImage(img,{x:0,y:0,width:base.width,height:base.height});
      }
      var bytes=await out.save();
      var newSize=bytes.byteLength,oldSize=file.files[0].size;
      var blob2=new Blob([bytes],{type:'application/pdf'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob2);a.download='compressed.pdf';a.click();
      var pct=oldSize?Math.round((1-newSize/oldSize)*100):0;
      if(newSize<oldSize){
        show(fmt(oldSize)+' → '+fmt(newSize)+' ('+pct+'% '+I.smaller+') — '+I.done,true);
      }else{
        show(I.from+' '+fmt(oldSize)+' · '+I.to+' '+fmt(newSize)+'. '+I.bigger,true);
      }
    }catch(e){show(I.bad+' ('+e.message+')',false);}
  });
});
})();
</script>

<p class="afw-pdfwarn">{{ i18n "pdf_compress_disclaimer" }}</p>
<p class="afw-pdfnote">{{ i18n "pdf_original_note" }}</p>
<p class="afw-pdfnote">{{ i18n "pdf_local_note" }}</p>
</div>
