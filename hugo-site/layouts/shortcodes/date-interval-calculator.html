<div class="afw-tool afw-dint" data-lang="{{ .Page.Lang }}">
<style>
.afw-dint{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-dint input[type=date]{font-size:14px;border:1px solid #cbd5e1;border-radius:8px;padding:.5rem .6rem;background:#fff;color:#1e293b;margin:.3rem .6rem .3rem 0}
.afw-dint label{display:block;font-size:.85rem;font-weight:600;margin:.6rem 0 .3rem;color:#334155}
.afw-dint .out{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:1rem 1.1rem;margin-top:.8rem}
.afw-dint .row{display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px dashed #e2e8f0;font-size:.92rem;color:#334155}
.afw-dint .row:last-child{border-bottom:none}
.afw-dint .row b{color:#0f172a;font-variant-numeric:tabular-nums}
</style>
<label class="lbl-a"></label>
<input type="date" id="afwDintA">
<label class="lbl-b"></label>
<input type="date" id="afwDintB">
<div class="out" id="afwDintOut" hidden>
  <div class="row lbl-days"><span></span><b id="afwDintDays"></b></div>
  <div class="row lbl-inc"><span></span><b id="afwDintInc"></b></div>
  <div class="row lbl-workdays"><span></span><b id="afwDintWork"></b></div>
  <div class="row lbl-weeks"><span></span><b id="afwDintWeeks"></b></div>
</div>
<script>
(function(){
var root=document.querySelector('.afw-dint');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{a:'Start date',b:'End date',days:'Days between',inc:'Calendar days (inclusive)',workdays:'Working days (Mon–Fri, inclusive)',weeks:'Weeks',note:'Working days include both dates and exclude weekends. Public holidays vary by country and are not included.'},
 ja:{a:'開始日',b:'終了日',days:'日数（差）',inc:'暦日数（両端を含む）',workdays:'営業日（月–金・両端を含む）',weeks:'週数',note:'営業日は開始日と終了日の両方を含み、週末を除きます。祝日は国により異なるため含まれません。'},
 zh:{a:'开始日期',b:'结束日期',days:'相差天数',inc:'日历天数（含首尾）',workdays:'工作日（周一至周五，含首尾）',weeks:'周数',note:'工作日包含首尾两天并排除周末。法定节假日因国家而异，未计入。'}
}[L]||I.en;
document.querySelector('.afw-dint .lbl-a').textContent=I.a;
document.querySelector('.afw-dint .lbl-b').textContent=I.b;
document.querySelector('.afw-dint .lbl-days span').textContent=I.days;
document.querySelector('.afw-dint .lbl-workdays span').textContent=I.workdays;
document.querySelector('.afw-dint .lbl-weeks span').textContent=I.weeks;
document.querySelector('.afw-dint .lbl-inc span').textContent=I.inc;
var a=document.getElementById('afwDintA'),b=document.getElementById('afwDintB'),out=document.getElementById('afwDintOut');
function calc(){
  if(!a.value||!b.value){out.hidden=true;return;}
  var d1=new Date(a.value),d2=new Date(b.value);
  if(d2<d1){var t=d1;d1=d2;d2=t;a.value=d1.toISOString().slice(0,10);b.value=d2.toISOString().slice(0,10);}
  var ms=d2-d1,days=Math.round(ms/86400000);
  var work=0;var cur=new Date(d1);
  while(cur<=d2){var wd=cur.getDay();if(wd!==0&&wd!==6)work++;cur.setDate(cur.getDate()+1);}
  document.getElementById('afwDintDays').textContent=days;
  document.getElementById('afwDintInc').textContent=days+1;
  document.getElementById('afwDintWork').textContent=work;
  document.getElementById('afwDintWeeks').textContent=(days/7).toFixed(1);
    out.hidden=false;
}
a.addEventListener('change',calc);
b.addEventListener('change',calc);
})();
</script>
</div>
