<div class="afw-tool afw-md" data-lang="{{ .Page.Lang }}">
<style>
.afw-md{max-width:860px;margin:1.5rem 0;font-family:inherit}
.afw-md textarea{width:100%;box-sizing:border-box;min-height:200px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;border:1px solid #cbd5e1;border-radius:8px;padding:.7rem .85rem;background:#fff;color:#1e293b;resize:vertical}
.afw-md .panes{display:flex;gap:.8rem;flex-wrap:wrap}
.afw-md .panes>div{flex:1;min-width:280px}
.afw-md label{display:block;font-size:.85rem;font-weight:600;margin:.5rem 0 .35rem;color:#334155}
.afw-md .prev{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:.7rem 1rem;min-height:200px;line-height:1.65;color:#1e293b;font-size:.95rem;overflow:auto}
.afw-md .prev h1,.afw-md .prev h2,.afw-md .prev h3{margin:.8rem 0 .4rem;line-height:1.3}
.afw-md .prev h1{font-size:1.5rem}.afw-md .prev h2{font-size:1.25rem}.afw-md .prev h3{font-size:1.05rem}
.afw-md .prev code{background:#f1f5f9;border-radius:4px;padding:.1rem .3rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
.afw-md .prev pre{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:.7rem;overflow:auto}
.afw-md .prev pre code{background:none;padding:0}
.afw-md .prev blockquote{border-left:4px solid #cbd5e1;margin:.6rem 0;padding:.1rem .8rem;color:#475569}
.afw-md .prev hr{border:none;border-top:1px solid #e2e8f0;margin:1rem 0}
.afw-md .prev img{max-width:100%}
</style>
<div class="panes">
  <div><label class="lbl-in"></label><textarea id="afwMdIn" placeholder="# Title&#10;&#10;Some **bold** and *italic* text with `code`.&#10;&#10;- item 1&#10;- item 2&#10;&#10;&gt; a quote&#10;&#10;```js&#10;console.log(&quot;hi&quot;);&#10;```"></textarea></div>
  <div><label class="lbl-out"></label><div class="prev" id="afwMdOut"></div></div>
</div>
<script>
(function(){
var root=document.querySelector('.afw-md');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{input:'Markdown',output:'Preview'},
 ja:{input:'Markdown',output:'プレビュー'},
 zh:{input:'Markdown',output:'预览'}
}[L]||I.en;
document.querySelector('.afw-md .lbl-in').textContent=I.input;
document.querySelector('.afw-md .lbl-out').textContent=I.output;
var tin=document.getElementById('afwMdIn'),tout=document.getElementById('afwMdOut');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" rel="noopener">$1</a>');
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1">');
  return s;
}
function render(src){
  var lines=src.replace(/\r\n?/g,'\n').split('\n'),html='',i=0;
  while(i<lines.length){
    var l=lines[i];
    var m;
    if(m=l.match(/^```(.*)/)){var lang=m[1],code='';i++;while(i<lines.length&&!lines[i].match(/^```/)){code+=lines[i]+'\n';i++;}i++;html+='<pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre>';continue;}
    if(m=l.match(/^(#{1,6})\s+(.*)/)){var n=m[1].length;html+='<h'+n+'>'+inline(m[2])+'</h'+n+'>';i++;continue;}
    if(l.match(/^---+$/)){html+='<hr>';i++;continue;}
    if(m=l.match(/^&gt;\s?(.*)/)||l.match(/^>\s?(.*)/)){var q='';while(i<lines.length&&((m=lines[i].match(/^&gt;\s?(.*)/))||(m=lines[i].match(/^>\s?(.*)/)))){q+=m[1]+' ';i++;}html+='<blockquote>'+inline(q)+'</blockquote>';continue;}
    if(l.match(/^[-*+]\s+/)){var items=[];while(i<lines.length&&lines[i].match(/^[-*+]\s+/)){items.push('<li>'+inline(lines[i].replace(/^[-*+]\s+/,''))+'</li>');i++;}html+='<ul>'+items.join('')+'</ul>';continue;}
    if(l.match(/^\d+\.\s+/)){var its=[];while(i<lines.length&&lines[i].match(/^\d+\.\s+/)){its.push('<li>'+inline(lines[i].replace(/^\d+\.\s+/,''))+'</li>');i++;}html+='<ol>'+its.join('')+'</ol>';continue;}
    if(l.trim()===''){i++;continue;}
    var para=l;i++;while(i<lines.length&&lines[i].trim()!==''&&!lines[i].match(/^(#{1,6})\s|^```|^[-*+]\s|^\d+\.\s|^>\s|^---+$/)){para+=' '+lines[i];i++;}
    html+='<p>'+inline(para)+'</p>';
  }
  return html;
}
tin.addEventListener('input',function(){tout.innerHTML=render(tin.value);});
tout.innerHTML=render(tin.value);
})();
</script>
</div>
