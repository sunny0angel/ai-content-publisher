<div class="afw-tool afw-icp" data-lang="{{ .Page.Lang }}">
<style>
.afw-icp{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-icp input[type=file]{font-size:.9rem;color:#334155}
.afw-icp img{max-width:320px;max-height:240px;border:1px solid #e2e8f0;border-radius:8px;margin:.8rem 0;display:block;cursor:crosshair}
.afw-icp .sw{display:inline-block;width:40px;height:40px;border-radius:6px;border:1px solid #cbd5e1;vertical-align:middle;margin-left:.5rem}
.afw-icp .meta{font-size:.88rem;color:#334155;line-height:1.8}
.afw-icp .pal{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.afw-icp .chip{width:44px;height:44px;border-radius:6px;border:1px solid #cbd5e1;cursor:pointer}
</style>
<input type="file" id="afwIcpFile" accept="image/*">
<div class="meta" id="afwIcpMeta"></div>
<div class="meta"><span id="afwIcpLabel"></span><span class="sw" id="afwIcpSw"></span></div>
<img id="afwIcpImg" alt="">
<div class="meta" id="afwIcpPalLabel"></div>
<div class="pal" id="afwIcpPal"></div>
<script>
(function(){
var root=document.querySelector('.afw-icp');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{pick:'Choose an image first',click:'Click anywhere on the image to pick a color',picked:'Picked:',palette:'Dominant palette:',copied:'Copied'},
 ja:{pick:'先に画像を選択してください',click:'画像の任意の場所をクリックして色を取得',picked:'取得色:',palette:'メインカラー:',copied:'コピーしました'},
 zh:{pick:'请先选择图片',click:'点击图片任意位置取色',picked:'取色:',palette:'主色调:',copied:'已复制'}
}[L]||I.en;
document.getElementById('afwIcpMeta').textContent=I.click;
document.getElementById('afwIcpLabel').textContent=I.picked;
document.getElementById('afwIcpPalLabel').textContent=I.palette;
var file=document.getElementById('afwIcpFile'),img=document.getElementById('afwIcpImg'),sw=document.getElementById('afwIcpSw');
var src=null;
file.addEventListener('change',function(){if(!file.files[0])return;var fr=new FileReader();fr.onload=function(e){src=e.target.result;img.src=src;buildPalette();};fr.readAsDataURL(file.files[0]);});
img.addEventListener('click',function(e){
  if(!src)return;
  var rect=img.getBoundingClientRect();
  var px=(e.clientX-rect.left)*(img.naturalWidth/rect.width);
  var py=(e.clientY-rect.top)*(img.naturalHeight/rect.height);
  var c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
  c.getContext('2d').drawImage(img,0,0);
  var d=c.getContext('2d').getImageData(Math.floor(px),Math.floor(py),1,1).data;
  sw.style.background='rgb('+d[0]+','+d[1]+','+d[2]+')';
  var hex='#'+[d[0],d[1],d[2]].map(function(x){return x.toString(16).padStart(2,'0');}).join('');
  navigator.clipboard&&navigator.clipboard.writeText(hex);
});
function buildPalette(){
  var c=document.createElement('canvas');
  var scale=Math.min(1,64/img.naturalWidth);
  c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);
  var x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
  var data=x.getImageData(0,0,c.width,c.height).data;
  var buckets={};
  for(var i=0;i<data.length;i+=4){
    var key=(data[i]>>4<<8)|(data[i+1]>>4<<4)|(data[i+2]>>4);
    buckets[key]=(buckets[key]||0)+1;
  }
  var top=Object.entries(buckets).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
  var pal=document.getElementById('afwIcpPal');pal.innerHTML='';
  top.forEach(function(e){
    var k=Number(e[0]);
    var r=((k>>8)&15)*17,g=((k>>4)&15)*17,b=(k&15)*17;
    var div=document.createElement('div');
    div.className='chip';div.style.background='rgb('+r+','+g+','+b+')';
    div.title='rgb('+r+','+g+','+b+')';
    div.addEventListener('click',function(){navigator.clipboard&&navigator.clipboard.writeText(div.title);});
    pal.appendChild(div);
  });
}
})();
</script>
</div>
