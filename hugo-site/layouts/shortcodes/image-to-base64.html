<div class="afw-tool afw-i2b" data-lang="{{ .Page.Lang }}">
<style>
.afw-i2b{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-i2b input[type=file]{font-size:.9rem;color:#334155}
.afw-i2b .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:.55rem 1rem;font-size:.9rem;font-weight:600;cursor:pointer;margin:.6rem .4rem 0 0}
.afw-i2b .btn:hover{background:#1d4ed8}
.afw-i2b .btn.sec{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
.afw-i2b .btn.sec:hover{background:#e2e8f0}
.afw-i2b textarea{width:100%;box-sizing:border-box;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;border:1px solid #cbd5e1;border-radius:8px;padding:.7rem;background:#fff;color:#1e293b;margin-top:.6rem;word-break:break-all}
.afw-i2b .meta{font-size:.82rem;color:#64748b;margin-top:.4rem}
</style>
<input type="file" id="afwI2bFile" accept="image/*">
<div>
  <button class="btn" id="afwI2bGo" type="button"></button>
  <button class="btn sec" id="afwI2bCopy" type="button"></button>
</div>
<textarea id="afwI2bOut" readonly placeholder="data:image/png;base64,..."></textarea>
<div class="meta" id="afwI2bMeta"></div>
<script>
(function(){
var root=document.querySelector('.afw-i2b');if(!root)return;
var L=root.getAttribute('data-lang')||'en';
var I={
 en:{go:'Convert to Base64',copy:'Copy',pick:'Choose an image first',done:'Done — the Data URL is ready to paste into HTML/CSS'},
 ja:{go:'Base64に変換',copy:'コピー',pick:'先に画像を選択してください',done:'完了——HTML/CSSに貼り付けられるData URLです'},
 zh:{go:'转为 Base64',copy:'复制',pick:'请先选择图片',done:'完成——可直接粘贴进 HTML/CSS 的 Data URL'}
}[L]||I.en;
document.getElementById('afwI2bGo').textContent=I.go;
document.getElementById('afwI2bCopy').textContent=I.copy;
var file=document.getElementById('afwI2bFile'),out=document.getElementById('afwI2bOut'),meta=document.getElementById('afwI2bMeta');
file.addEventListener('change',function(){
  if(!file.files[0])return;
  var fr=new FileReader();
  fr.onload=function(e){out.value=e.target.result;meta.textContent=I.done;};
  fr.readAsDataURL(file.files[0]);
});
document.getElementById('afwI2bGo').addEventListener('click',function(){if(!file.files[0]){alert(I.pick);return;}file.dispatchEvent(new Event('change'));});
document.getElementById('afwI2bCopy').addEventListener('click',function(){if(!out.value)return;navigator.clipboard&&navigator.clipboard.writeText(out.value);});
})();
</script>
</div>
