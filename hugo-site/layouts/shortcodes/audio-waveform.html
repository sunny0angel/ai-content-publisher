<div class="afw-tool afw-awf" data-lang="{{ .Page.Lang }}">
<style>
.afw-awf{max-width:760px;margin:1.5rem 0;font-family:inherit}
.afw-awf input[type=file]{font-size:.9rem;color:#334155}
.afw-awf audio{display:block;margin:.8rem 0;width:100%}
.afw-awf canvas{width:100%;height:140px;border:1px solid #e2e8f0;border-radius:8px;background:#0f172a;display:block}
</style>
<input type="file" id="afwAwfFile" accept="audio/*">
<audio id="afwAwfAudio" controls></audio>
<canvas id="afwAwfCv"></canvas>
<script>
(function(){
var root=document.querySelector('.afw-awf');if(!root)return;
var file=document.getElementById('afwAwfFile'),audio=document.getElementById('afwAwfAudio'),cv=document.getElementById('afwAwfCv');
var ctx,analyser,raf;
file.addEventListener('change',function(){
  if(!file.files[0])return;
  if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=256;var src=ctx.createMediaElementSource(audio);src.connect(analyser);analyser.connect(ctx.destination);}
  audio.src=URL.createObjectURL(file.files[0]);
  audio.onplay=function(){if(ctx.state==='suspended')ctx.resume();if(!raf)loop();};
});
function loop(){
  raf=requestAnimationFrame(loop);
  var g=cv.getContext('2d'),W=cv.width=cv.clientWidth,H=cv.height=cv.clientHeight;
  g.clearRect(0,0,W,H);
  if(!analyser)return;
  var data=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  var barW=W/data.length;
  for(var i=0;i<data.length;i++){
    var h=(data[i]/255)*H;
    var hue=200+(i/data.length)*120;
    g.fillStyle='hsl('+hue+',80%,55%)';
    g.fillRect(i*barW,H-h,Math.max(1,barW-1),h);
  }
}
})();
</script>
</div>
