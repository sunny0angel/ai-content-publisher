baseURL = "https://ai-content-hub-b0t.pages.dev"
title = "AI Content Hub"
theme = "papermod"
defaultContentLanguage = "en"
enableRobotsTXT = true

paginate = 10
summaryLength = 30

[params]
  description = "Practical guides and insights on AI for business, HR, and productivity"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowLastMod = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

  [params.homeInfoParams]
    Title = "AI Content Hub"
    Content = "Practical guides, tutorials, and insights on leveraging AI for business, HR, and productivity. Stay ahead with the latest AI trends and automation strategies."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com"

  [params.schema]
    [params.schema.publisher]
      name = "AI Content Hub"
      type = "Organization"

[menu]
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 5
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 10
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 15

[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["txt"]

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS"]

[languages]
  [languages.en]
    locale = "en-US"
    label = "English"
    title = "AI Content Hub"
    contentDir = "content/en"
    weight = 1
    [languages.en.params]
      description = "Practical guides and insights on AI for business, HR, and productivity"

  [languages.ja]
    locale = "ja-JP"
    label = "日本語"
    title = "AI Content Hub"
    contentDir = "content/ja"
    weight = 2
    [languages.ja.params]
      description = "ビジネス・人事・生産性のためのAI実践ガイド"
    [[languages.ja.menu.main]]
      identifier = "categories"
      name = "カテゴリ"
      url = "/categories/"
      weight = 5
    [[languages.ja.menu.main]]
      identifier = "tags"
      name = "タグ"
      url = "/tags/"
      weight = 10
    [[languages.ja.menu.main]]
      identifier = "search"
      name = "検索"
      url = "/search/"
      weight = 15

  [languages.zh]
    locale = "zh-CN"
    label = "中文"
    title = "AI Content Hub"
    contentDir = "content/zh"
    weight = 3
    [languages.zh.params]
      description = "面向商业、人力资源和生产力的AI实用指南"
    [[languages.zh.menu.main]]
      identifier = "categories"
      name = "分类"
      url = "/categories/"
      weight = 5
    [[languages.zh.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/tags/"
      weight = 10
    [[languages.zh.menu.main]]
      identifier = "search"
      name = "搜索"
      url = "/search/"
      weight = 15
