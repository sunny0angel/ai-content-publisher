baseURL = "https://aifwd.net"
title = "AI Forward"
theme = "adritian"
defaultContentLanguage = "en"
enableRobotsTXT = true
hasCJKLanguage = true

[pagination]
pagerSize = 10

[outputs]
page = ["HTML"]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]
[taxonomies]
tag = "tags"
category = "categories"
author = "authors"
series = "series"
topic = "topics"

disableKinds = ["footerSection"]

[module]
[[module.imports]]
path = "github.com/zetxek/adritian-free-hugo-theme"

[[module.mounts]]
source = "archetypes"
target = "archetypes"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "data"
target = "data"

[[module.mounts]]
source = "i18n"
target = "i18n"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "node_modules/bootstrap/scss"
target = "assets/scss/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js"
target = "assets/js/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
target = "assets/js/vendor/bootstrap.bundle.min.js"

[[module.mounts]]
source = "node_modules/bootstrap-print-css/css/bootstrap-print.css"
target = "assets/css/bootstrap-print.css"

[params]
title = "AI Forward — Practical AI Guides for Business & HR"
description = "Practical guides, tutorials, and insights on leveraging AI for business, HR, and productivity. Stay ahead with the latest AI trends and automation strategies."
images = ["/images/og-image.png"]
themeColor = "#2563eb"
colorScheme = "default"
logo = "/images/logo.png"
slogan = "Forward with AI"

[params.favicons]
source = "icons/favicon.png"

[params.seo]
siteName = "AI Forward"
siteDescription = "Practical guides, tutorials, and insights on leveraging AI for business, HR, and productivity."
siteImage = "/images/og-image.png"

[params.seo.person]
name = "Yudi"
url = "https://aifwd.net"
sameAs = [
  "https://x.com/AIFWD_NET",
]
sections = [
  "showcase",
  "education",
  "experience",
  "testimonial",
  "contact",
]

[params.social]
twitter = "AIFWD_NET"

[params.blog]
layout = "sidebar-right"
sidebarWidth = "25"
narrowContent = true
showCategories = true
showRecentPosts = true
recentPostCount = 5
listStyle = "summary"
listLayout = "default"

[params.plugins]
[[params.plugins.css]]
URL = "css/custom.css"
[[params.plugins.css]]
URL = "css/adritian-icons.css"
[[params.plugins.css]]
URL = "css/bootstrap-print.css"
[[params.plugins.js]]
URL = "js/rad-animations.js"
[[params.plugins.js]]
URL = "js/sticky-header.js"
[[params.plugins.js]]
URL = "js/library/fontfaceobserver.js"
[[params.plugins.scss]]
URL = "scss/adritian.scss"

[languages]
[languages.en]
disabled = false
locale = "en"
direction = "ltr"
label = "English"
title = "AI Forward"
contentDir = "content"
weight = 0

[languages.en.menus]
[[languages.en.menus.header]]
name = "Home"
URL = "/"
weight = 1
[[languages.en.menus.header]]
name = "Blog"
URL = "/blog"
weight = 2
[[languages.en.menus.header]]
name = "About"
URL = "/about/"
weight = 3
[[languages.en.menus.header]]
pre = "search"
name = "Search"
URL = "/search"
weight = 4
[[languages.en.menus.footer]]
name = "Home"
URL = "/"
weight = 1
[[languages.en.menus.footer]]
name = "Blog"
URL = "/blog"
weight = 2
[[languages.en.menus.footer]]
name = "About"
URL = "/about/"
weight = 3

[languages.ja]
disabled = false
locale = "ja"
direction = "ltr"
label = "日本語"
title = "AI Forward"
contentDir = "content"
