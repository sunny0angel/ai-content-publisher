weight = 1
[[languages.ja.menus.header]]
name = "ブログ"
URL = "/ja/blog"
weight = 2
[[languages.ja.menus.header]]
name = "プロフィール"
URL = "/ja/about/"
weight = 3
[[languages.ja.menus.header]]
pre = "search"
name = "検索"
URL = "/search"
weight = 4
[[languages.ja.menus.footer]]
name = "ホーム"
URL = "/ja/"
weight = 1
[[languages.ja.menus.footer]]
name = "ブログ"
URL = "/ja/blog"
weight = 2
[[languages.ja.menus.footer]]
name = "プロフィール"
URL = "/ja/about/"
weight = 3

[languages.zh]
disabled = false
locale = "zh"
direction = "ltr"
label = "中文"
title = "AI Forward"
contentDir = "content"
weight = 0

[languages.zh.menus]
[[languages.zh.menus.header]]
name = "首页"
URL = "/zh/"
weight = 1
[[languages.zh.menus.header]]
name = "博客"
URL = "/zh/blog"
