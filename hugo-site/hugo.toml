weight = 2
[[languages.zh.menus.footer]]
name = "关于"
URL = "/zh/about/"
weight = 3

[params.languages.selector.disable]
footer = false
header = false
mobileHeader = false

[params.colorTheme.selector.disable]
footer = false
header = false
mobileHeader = false

[params.sharing]
bluesky = true
mastodon = true

[params.navbarOverflow]
mode = "dropdown"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
lineNos = false
noClasses = false
style = "github"

[imaging]
resampleFilter = "Lanczos"
quality = 85
anchor = "Smart"

[minify]
disableCSS = false
disableHTML = false
disableJS = false
disableJSON = false
disableSVG = false
disableXML = false
minifyOutput = true

[build]
writeStats = true

[build.buildStats]
enable = true
enabledFor = ["scss"]
disableClasses = false
disableIDs = false
disableTags = false
