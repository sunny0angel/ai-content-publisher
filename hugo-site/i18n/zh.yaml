- id: "about_content"
  translation: '<p class="lead">AI研究者和内容创作者，致力于帮助企业和专业人士将人工智能应用于实际场景。</p><p>凭借在AI驱动自动化和企业技术领域的深厚经验，我创建数据驱动的指南、教程和分析文章，帮助读者穿透炒作。每篇文章都经过一手信源（Stanford HAI、McKinsey、Gartner、摩根士丹利）的研究，提供可操作的洞察——而非泛泛之谈。</p><p>在X上关注我，获取每日AI洞察和文章更新。</p>'
