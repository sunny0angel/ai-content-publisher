- id: "about_content"
  translation: '<p class="lead">AIリサーチャー、コンテンツクリエイター。企業とプロフェッショナルがAIを実践的に活用するための情報を発信しています。</p><p>AI駆動の自動化とエンタープライズテクノロジーに関する深い知見を活かし、データ駆動のガイド、チュートリアル、分析記事を制作。すべての記事は一次情報源（Stanford HAI、McKinsey、Gartner、Morgan Stanley）からリサーチされ、実行可能なインサイトを提供します。</p><p>Xでフォローしていただければ、日々のAIインサイトと記事更新情報をお届けします。</p>'
